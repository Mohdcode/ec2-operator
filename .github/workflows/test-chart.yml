name: Test Chart

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install kind
        env:
          KIND_VERSION: v0.27.0
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind
          sudo install kind /usr/local/bin/kind

      - name: Install Helm
        env:
          HELM_VERSION: v3.17.3
        run: |
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Lint release chart
        run: helm lint ./helm/charts/ec2-operator

      - name: Create kind cluster
        run: kind create cluster --wait 120s

      - name: Build and load controller image
        run: |
          make docker-build IMG=ec2-operator:ci
          kind load docker-image ec2-operator:ci

      - name: Install release chart
        run: |
          helm upgrade --install ec2-operator ./helm/charts/ec2-operator \
            --namespace ec2-operator-system \
            --create-namespace \
            --set image.repository=ec2-operator \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --wait \
            --timeout 5m
          kubectl rollout status deployment/ec2-operator \
            --namespace ec2-operator-system \
            --timeout=5m
          kubectl get crd ec2instances.compute.cloud.com

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe deployment/ec2-operator -n ec2-operator-system || true
          kubectl logs -n ec2-operator-system deployment/ec2-operator --tail=200 || true

      - name: Clean up kind cluster
        if: always()
        run: kind delete cluster
