# Default values for ec2-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/mohdcode/ec2-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

nameOverride: "ec2-operator"
fullnameOverride: "ec2-operator"

aws:
  # Optional custom AWS-compatible endpoint, for example LocalStack.
  endpoint: ""
  # Leave empty to use the AWS SDK default credential chain (such as a pod role).
  # For LocalStack, point this at a Kubernetes Secret containing test credentials.
  credentialsSecretName: ""
  accessKeyIdSecretKey: AWS_ACCESS_KEY_ID
  secretAccessKeySecretKey: AWS_SECRET_ACCESS_KEY

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false

autoscaling:
  enabled: false

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"
